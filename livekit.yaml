# LiveKit Server 本地开发配置
# 说明：本机浏览器 ↔ 本机 Docker 的场景不需要外网 IP；
#       如果要给局域网其它机器联调，把 use_external_ip 改为 true 并放行防火墙端口。
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

# API Key/Secret：Go 后端签 JWT 用同一对（见 server/main.go 里的默认值）
# 正式环境请换成足够长的随机密钥
keys:
  devkey: devkeysecret

logging:
  level: info
