# 反向代理（nginx）示例：单域名 + TLS，一个源承载全部流量
# 放到 /etc/nginx/conf.d/voicerooms.conf
# 证书路径按你的实际签发方式调整（Let's Encrypt 通常是 /etc/letsencrypt/live/域名/）

# WebSocket 升级所需的标准映射
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	http2 on;
	server_name your-domain.com;          # ← 改成你的域名

	# ---- TLS 证书（二选一）----
	# Let's Encrypt（certbot 签发）：
	ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
	# 云厂商免费证书（阿里云/腾讯云下载的 nginx 格式）：
	# ssl_certificate     /etc/nginx/ssl/fullchain.pem;
	# ssl_certificate_key /etc/nginx/ssl/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;

	# 上传体积很小，限制一下
	client_max_body_size 1m;

	# 页面本体：SvelteKit adapter-node（127.0.0.1:3000）
	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Go 后端 REST API
	location /api/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Go 后端成员同步 WebSocket（长连接，加大超时）
	location /ws {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	# LiveKit 信令（wss），路径代理方案——前端 resolveSignalUrl 会自动改写到此处
	location /livekit/ {
		proxy_pass http://127.0.0.1:7880;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}

# HTTP 全部跳转 HTTPS
server {
	listen 80;
	server_name your-domain.com;          # ← 改成你的域名
	return 301 https://$host$request_uri;
}
